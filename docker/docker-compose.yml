services:
  metapi:
    image: 1467078763/metapi:latest
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./data:/app/data
    environment:
      AUTH_TOKEN: ${AUTH_TOKEN:?AUTH_TOKEN is required}
      PROXY_TOKEN: ${PROXY_TOKEN:?PROXY_TOKEN is required}
      CHECKIN_CRON: "0 8 * * *"
      BALANCE_REFRESH_CRON: "0 * * * *"
      PORT: ${PORT:-4000}
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Shanghai}
      RESIN_STICKY_PROXY_ENDPOINTS: ${RESIN_STICKY_PROXY_ENDPOINTS:-}
      RESIN_EGRESS_GUARD_URL: ${RESIN_EGRESS_GUARD_URL:-}
      RESIN_EGRESS_GUARD_TOKEN_FILE: ${RESIN_EGRESS_GUARD_TOKEN_FILE:-}
      RESIN_EGRESS_GUARD_TIMEOUT_MS: ${RESIN_EGRESS_GUARD_TIMEOUT_MS:-1500}
      RESIN_EGRESS_CONNECT_TIMEOUT_MS: ${RESIN_EGRESS_CONNECT_TIMEOUT_MS:-10000}
      RESIN_EGRESS_TLS_HANDSHAKE_TIMEOUT_MS: ${RESIN_EGRESS_TLS_HANDSHAKE_TIMEOUT_MS:-10000}
      RESIN_EGRESS_RESPONSE_HEADER_TIMEOUT_MS: ${RESIN_EGRESS_RESPONSE_HEADER_TIMEOUT_MS:-120000}
      PROXY_FIRST_BYTE_TIMEOUT_SEC: ${PROXY_FIRST_BYTE_TIMEOUT_SEC:-0}
    restart: unless-stopped
