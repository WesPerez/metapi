name: Build & Push (mine)

on:
  push:
    branches: [mine]
  workflow_dispatch:

concurrency:
  group: mine-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Test Resin recovery and check-in retry
        run: >-
          npx vitest run --root .
          src/server/services/platforms/newApi.test.ts
          src/server/services/platforms/anyrouterCurl.test.ts
          src/server/services/siteProxy.test.ts
          src/server/services/resinEgressFeedback.test.ts
          src/server/services/resinProxyIdentityService.test.ts
          src/server/services/checkinService.autoRelogin.test.ts
          src/web/api.test.ts

      - name: Typecheck server
        run: npm run typecheck:server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repo owner
        id: repo
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ steps.repo.outputs.owner }}/metapi:mine
            ghcr.io/${{ steps.repo.outputs.owner }}/metapi:mine-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
